plugins:
    -   vendor: 'laravel/breeze'
        version: 'dev-master'
        files:
            -   source: 'breeze/master/breeze.json'
                target: '{locale}.json'

    -   vendor: 'laravel/breeze'
        version: '^2.0'
        files:
            -   source: 'breeze/2.x/breeze.json'
                target: '{locale}.json'

    -   vendor: 'laravel/fortify'
        version: 'dev-master'
        files:
            -   source: 'fortify/master/fortify.json'
                target: '{locale}.json'

    -   vendor: 'laravel/fortify'
        version: '^1.0'
        files:
            -   source: 'fortify/1.x/fortify.json'
                target: '{locale}.json'

    -   vendor: 'laravel/framework'
        version: 'dev-master'
        files:
            -   source: 'framework/master/auth.php'
                target: '{locale}/auth.php'
            -   source: 'framework/master/pagination.php'
                target: '{locale}/pagination.php'
            -   source: 'framework/master/passwords.php'
                target: '{locale}/passwords.php'
            -   source: 'framework/master/validation.php'
                target: '{locale}/validation.php'

    -   vendor: 'laravel/framework'
        version: '^12.0'
        files:
            -   source: 'framework/12.x/auth.php'
                target: '{locale}/auth.php'
            -   source: 'framework/12.x/pagination.php'
                target: '{locale}/pagination.php'
            -   source: 'framework/12.x/passwords.php'
                target: '{locale}/passwords.php'
            -   source: 'framework/12.x/validation.php'
                target: '{locale}/validation.php'

    -   vendor: 'laravel/framework'
        version: '^13.0'
        files:
            -   source: 'framework/13.x/auth.php'
                target: '{locale}/auth.php'
            -   source: 'framework/13.x/pagination.php'
                target: '{locale}/pagination.php'
            -   source: 'framework/13.x/passwords.php'
                target: '{locale}/passwords.php'
            -   source: 'framework/13.x/validation.php'
                target: '{locale}/validation.php'

    -   vendor: 'laravel/jetstream'
        version: 'dev-master'
        files:
            -   source: 'jetstream/master/jetstream.json'
                target: '{locale}.json'

    -   vendor: 'laravel/jetstream'
        version: '^5.0'
        files:
            -   source: 'jetstream/5.x/jetstream.json'
                target: '{locale}.json'

    -   vendor: 'laravel/nova'
        version: '^4.0'
        files:
            -   source: 'nova/4.x/nova.json'
                target: 'vendor/nova/{locale}.json'
            -   source: 'nova/4.x/validation.php'
                target: 'vendor/nova/{locale}/validation.php'

    -   vendor: 'laravel/nova'
        version: '^5.0'
        files:
            -   source: 'nova/5.x/nova.json'
                target: 'vendor/nova/{locale}.json'
            -   source: 'nova/5.x/validation.php'
                target: 'vendor/nova/{locale}/validation.php'

    -   vendor: 'laravel/nova-log-viewer'
        version: 'dev-main'
        files:
            -   source: 'nova-log-viewer/main/nova-log-viewer.json'
                target: 'vendor/nova/{locale}.json'

    -   vendor: 'laravel/nova-log-viewer'
        version: '^1.0'
        files:
            -   source: 'nova-log-viewer/1.x/nova-log-viewer.json'
                target: 'vendor/nova/{locale}.json'

    -   vendor: 'laravel/passkeys'
        version: 'dev-main || 0.*'
        files:
            -   source: 'passkeys/main/passkeys.json'
                target: '{locale}.json'

    -   vendor: 'laravel/ui'
        version: '^4.0'
        files:
            -   source: 'ui/4.x/ui.json'
                target: '{locale}.json'
