name: Close Pull Request

on:
    pull_request_target:
        types: [opened]

jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - uses: superbrothers/close-pull-request@9c18513d320d7b2c7185fb93396d0c664d5d8448 # v3.1.2
              with:
                  comment: |
                      Thank you for your pull request.

                      However, you have submitted this PR on the Laravel-Lang organization which is a read-only sub split of `laravel-lang/mona`.

                      Please submit your PR on the https://github.com/Laravel-Lang/mona repository.

                      Thanks!
